 ORBIS_1850_NAME:0 "The Gathering Storm"
 ORBIS_1850_DESC:0 "1850 BCS. The Dauk Wars have broken Rhodoa, now a puppet of the SCP Foundation. Anthropia and Columbia stand together against Occidentalis, the Pindorama Pact of Caelum, Ultimaborea and Beringia arms in the north, and the Cold War is about to turn hot."
 ORBIS_1848_NAME:0 "The Second World War"
 ORBIS_1848_DESC:0 "23 December 1848 BCS. Occidentalis refuses Anthropia's ultimatum over Kanata. The Anthro-Columbian Alliance marches west, and the largest war in the history of Orbis begins."
