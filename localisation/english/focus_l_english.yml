l_english:
 SCP_start: "Preparing for the worst"
 SCP_start_desc: "There are rumours of a coming war. This war might make the Great War look like childsplay. We must prepare for the worst. Let's see our options..."
 SCP_focus: "Align with Anthropia"
 SCP_focus_1: "Align with Columbia"
 SCP_focus_2: "Align with Occidentalis"
 SCP_focus_3: "Hyper Industrialisation"
 SCP_focus_3_desc: "Our state economy is best described as a Military Industrial Complex amped to the maximum. Without war, there is no economy and without economy there is no war. We must ramp up production to stand a chance against the    Meatshields of our enemies."
 SCP_focus_4: "All alone..."
 SCP_focus_5: "Train Anthropia"
 SCP_focus_5_desc: "Anthropian Troops aren't the most disciplined or ruly. By sending our officers over to train them, we can ensure a victory against our common foes."
 SCP_focus_6: "Supply Columbia"
 SCP_focus_6_desc: "The Columbian army is the pinnacle of incompetence and unequippedness. The only thing they amass are people, and they have a LOT of those. If we can supply them with enough weapons and maybe even drill their troops, our victory against the common foe is guaranteed."
 SCP_focus_7: "Prepare for the Worst"
 SCP_focus_7_desc: "We are alone. The world is looking toward us, we are vulnerable. To ensure our independence, we need to prepare."
 SCP_focus_9: "Fortify the Capital"
 SCP_focus_9_desc: "Fortify everything, EVERYTHIGN! No stone unfortified, no wall without a gun! No soldier without a full kit! "
 SCP_focus_10: "Fortify the west"
 SCP_focus_10_desc: "The Columbian border, fortify it, every single border province, fortify every border city, WE NEED TO HOLD THEM OFF!"
 SCP_focus_11: "Prepare Industry"
 SCP_focus_12: "Fortify Diveterra"
 SCP_focus_12_desc: "Diveterra may break free, we need to secure our borders to them as well. Calibarn will be the fortress city to the north of our glorious capital. No one will cross the Hettian Mountainline!"
 SCP_focus_13: "The Guardian"
 SCP_focus_13_desc: "There is still one Elder Guardian, there...in the dark side of the world...we shall venture out and secure our capital even more..."
 SCP_focus_14: "VICTORY OR DEATH!"
 SCP_focus_14_desc: "WE NEED TO STRIKE NOW, OR ELSE THEY DO! VICTORY OR DEATH AGAINST THE PINDORAMA PACT! GLORY TO THE FOUNDATION, DEATH TO THE PACT!"
 SCP_focus_15: "The War Effort"
 SCP_focus_15_desc: "GIVE ME EVERY SINGLE PENNY YOU HAVE, EVERY SINGLE GUN, EVERY SINGLE SWORD! WE. NEED. TO. WIN!"
 SCP_focus_16: "ADVANCE!"
 SCP_focus_16_paste: "DEFEND!"
 SCP_focus_16_paste_desc: "They breached our defenses and captured Tokat. They are close to the capital...THEY ARE CLOSE TO US! STOP THEM ALREADY"
 SCP_focus_16_desc: "Lynchburg is ours, CHESAPEAKE IS ONLY A FEW MILES OFF! ADVANCE!"
 SCP_focus_18: "Let them breach"
 SCP_focus_18_desc: "We are letting out all SCPs as our last act. This might only delay them. May godd have mercy on the world."
 SCP_focus_17: "DEATH TO THE PACT"
 SCP_focus_17_desc: "CHESAPEAKE IS OURS! DEATH TO THE PACT! ADVANCE!"
 SCP_focus_19: "Victory"
 SCP_focus_19_paste: "Defeat"
 SCP_focus_19_desc: "We have won the war. Time to take what's rightfully ours."
 SCP_focus_19_paste_desc: "We have lost. It's time to count our losses and see what they will do to us."
 SCP_focus_20: "Prepare the Army"
 SCP_focus_20_desc: "Our army needs to be ready whenever our enemies strike."
 SCP_focus_21: "Ask for Naval Bases"
 SCP_focus_21_desc: "Our Submarine navy is stuck in Diveterra, it was constructed inland and transported aerially. Unethical, but it worked. Now, we need a proper port."
 SCP_focus_22: "Training Exercies"
 SCP_focus_22_desc: "We need to simulate offensive operations with our Anthropian allies in order to cooperate better when the war breaks out."
 SCP_focus_23: "The War"
 SCP_focus_23_desc: "The war has broken out. Depending on what path we chose, we may change our opinion now, or stick with our original plan. Note, that changing our minds will result in a demoralised army and major penalties."
 SCP_focus_24: "Black Mesa Garrison"
 SCP_focus_24_desc: "We need to protect Black Mesa; if its technology were to fall in the hands of our enemies, we would be dealt a devastating blow."
 SCP_focus_25: "Ask for FOB's"
 SCP_focus_25_desc: "We are very cramped in our power projection, we are land locked after all. We need to ask the Columbians for Forward operating bases."
 SCP_focus_26: "Final preparations"
 SCP_focus_26_desc: "We shall be ready for any scenario, be it a defensive or offensive war.  Our Columbian allies will have our backs, and we theirs. Glory to the Foundation."
 SCP_focus_27: "Fake Columbian Relations"
 SCP_focus_27_desc: "We need to get the trust of Columbia, the more they trust us, the more is the chance we may turn our back on them and help Occidentalis with relief from the east."
 SCP_focus_28: "Send Troops"
 SCP_focus_28_desc: "Occidentalis is suffering from massive rectuiment crisis, we need to send our own troops if they want to stand a chance againt our foes."
 SCP_focus_29: "Support Occidentalis"
 SCP_focus_29_desc: "Occidentalis lacks the proper military industry to produce enough weapons for their massive population. We need to assist them by building facotires in their lands."
 SCP_focus_30: "Brotherhood"
 SCP_focus_30_desc: "Enemies in the past, brothers now. We will help our Occidentalian allies in any conflict; so will they. We will win, no matter the foe"
